<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수영장 마그넷 세트 3D 뷰어 — Alltäglich</title>
<style>
  :root { --ink:#1c2752; --ink-soft:#5b6485; --paper:#f1f0ec; --line:rgba(28,39,82,.16); --pool:#3f9fd6; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--paper); color:var(--ink); overflow:hidden;
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif; }
  #gl { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; outline:none; }
  #gl.drag { cursor:grabbing; }
  #gl.over { cursor:move; }
  header { position:fixed; left:0; top:0; padding:22px 26px; pointer-events:none; }
  .brand { font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-soft); }
  h1 { margin:6px 0 0; font-size:clamp(20px,3.2vw,30px); font-weight:700; letter-spacing:-.02em; }
  .spec { margin:8px 0 0; font-size:12.5px; color:var(--ink-soft); }
  .panel { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); display:flex; gap:10px;
    flex-wrap:wrap; justify-content:center; width:max-content; max-width:calc(100vw - 24px); }
  .group { display:flex; background:rgba(255,255,255,.72); border:1px solid var(--line); border-radius:999px;
    padding:4px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  button { font:inherit; font-size:13.5px; color:var(--ink); background:transparent; border:0; border-radius:999px;
    padding:9px 16px; cursor:pointer; white-space:nowrap; min-height:38px; }
  .sel { align-items:center; }
  .sel span { font-size:12.5px; color:var(--ink-soft); padding:0 6px 0 12px; white-space:nowrap; }
  button:disabled { opacity:.35; cursor:default; background:transparent; }
  button:hover { background:rgba(63,159,214,.14); }
  button:focus-visible { outline:2px solid var(--pool); outline-offset:1px; }
  button[aria-pressed="true"] { background:var(--ink); color:#fff; }
  .hint { position:fixed; right:210px; top:26px; margin:0; font-size:12px; color:var(--ink-soft); pointer-events:none; }
  #art { position:fixed; right:26px; top:50%; transform:translateY(-52%); margin:0; width:168px; padding:14px; border-radius:18px;
    background:rgba(255,255,255,.72); border:1px solid var(--line); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  #art h2 { margin:0 0 10px; font-size:12.5px; font-weight:600; }
  #art canvas { display:block; width:92px; margin:0 auto; border-radius:8px; box-shadow:0 0 0 1px var(--line); }
  #art .row { display:flex; align-items:center; justify-content:space-between; margin-top:9px; font-size:12.5px; }
  #art input[type=color] { width:28px; height:28px; padding:0; border:1px solid var(--line); border-radius:50%; background:none; cursor:pointer; overflow:hidden; }
  #art input[type=color]::-webkit-color-swatch-wrapper { padding:0; }
  #art input[type=color]::-webkit-color-swatch { border:0; border-radius:50%; }
  #art input[type=color]::-moz-color-swatch { border:0; border-radius:50%; }
  #art .btns { display:grid; gap:6px; margin-top:12px; }
  #art .btns button, #art .btns label { display:block; text-align:center; font-size:12.5px; padding:8px 6px; min-height:0; border:1px solid var(--line); border-radius:10px; cursor:pointer; background:rgba(255,255,255,.6); }
  #art .btns label:hover { background:rgba(63,159,214,.14); }
  #art .btns label:focus-within { outline:2px solid var(--pool); outline-offset:1px; }
  #art input[type=file] { position:absolute; width:1px; height:1px; opacity:0; }
  #art .note { margin:8px 0 0; font-size:11px; color:var(--ink-soft); line-height:1.4; }
  @media (max-width:720px){ #art{ right:10px; top:10px; transform:none; width:118px; padding:9px; } #art h2{ display:none; } #art .note{ display:none; }
    #art canvas{ width:54px; margin:0 auto; } #art .row{ font-size:11.5px; margin-top:6px; } #art input[type=color]{ width:22px; height:22px; } #art .btns label, #art .btns button{ font-size:11px; padding:6px 4px; } }
  #msg { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:32px; text-align:center; line-height:1.6; font-size:13px; }
  @media (max-width:560px){ .hint{ display:none; } header{ padding:16px 18px; } button{ padding:7px 10px; font-size:12.5px; min-height:32px; }
    .panel{ gap:6px; bottom:12px; } .group{ padding:3px; } .sel span{ font-size:11.5px; padding:0 4px 0 8px; } }
</style>
<style>
.site header,.site .hint,.site #film,.site #toFilm,.site #art,.site .label,.site .sun,.site .bar,.site #loading{display:none!important}
.site-drive .panel{display:none!important}
.site-embed .panel{bottom:var(--site-bottom,150px);gap:6px}
.site-embed .panel .group[aria-label="보는 방향"],.site-embed .panel .group[aria-label="가까이 볼 제품"],.site-embed .panel .colors{display:none}
.site-embed .panel button{font-size:12px;padding:6px 12px;min-height:32px}
</style>

window.SITE_BG=b&&/^[0-9a-f]{6}$/i.test(b)?[0,2,4].map(function(i){return parseInt(b.substr(i,2),16)/255}):null;})();</script>

<body>
<canvas id="gl" tabindex="0" aria-label="수영장 마그넷 세트 3D 모델: 레인 로프, 사다리, 타일 레진. 드래그하거나 방향키로 회전할 수 있습니다."></canvas>
<header>
  <div class="brand">Alltäglich</div>
  <h1>수영장 마그넷 세트</h1>
  <p class="spec">레인 로프 · 사다리 · 타일 레진</p>
</header>
<p class="hint">끌어서 옮기기 · Shift+드래그(또는 오른쪽 버튼)로 회전 · 빈 곳 드래그로 시점 회전</p>
<aside id="art" aria-label="수영장 인쇄 이미지 편집">
  <h2>수영장 이미지</h2>
  <canvas id="artCv" width="200" height="360" role="img" aria-label="타일 레진 아래에 들어가는 수영장 인쇄 이미지"></canvas>
  <div class="row"><label for="cBg">바탕색</label><input type="color" id="cBg" value="#3aa7e0"></div>
  <div class="row"><label for="cMark">선 · T 색</label><input type="color" id="cMark" value="#14235a"></div>
  <div class="btns">
    <label>내 이미지 불러오기<input type="file" id="fImg" accept="image/*"></label>
    <button id="bReset" type="button">원래대로</button>
  </div>
  <p class="note" id="artNote">색을 바꾸거나 이미지 파일을 올리면 레진에 바로 반영됩니다.</p>
</aside>
<div class="panel">
  <div class="group" role="group" aria-label="보는 방향">
    <button data-view="top" aria-pressed="true">위에서</button>
    <button data-view="angle" aria-pressed="false">사선</button>
    <button data-view="low" aria-pressed="false">낮게</button>
  </div>
  <div class="group" role="group" aria-label="가까이 볼 제품">
    <button data-view="rope" aria-pressed="false">레인 로프</button>
    <button data-view="ladder" aria-pressed="false">사다리</button>
    <button data-view="resin" aria-pressed="false">타일 레진</button>
  </div>
  <div class="group">
    <button id="bStand" aria-pressed="false">스탠드에 부착</button>
    <button id="bLayout" type="button">배치 초기화</button>
  </div>
  <div class="group sel" role="group" aria-label="선택한 제품 회전">
    <span id="selName">제품을 선택하세요</span>
    <button id="bRotL" type="button" aria-label="왼쪽으로 15° 회전" disabled>⟲ 15°</button>
    <button id="bRotR" type="button" aria-label="오른쪽으로 15° 회전" disabled>⟳ 15°</button>
  </div>
</div>

  const a=document.getElementById('artCv'), x=a.getContext('2d'); x.clearRect(0,0,a.width,a.height); x.drawImage(pCv,0,0,a.width,a.height);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,pTex); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,pCv); gl.generateMipmap(gl.TEXTURE_2D);
}
// 2색 인쇄: 바탕 위에 반듯한 타일 격자와 중앙 세로줄(레인 마크)
function drawPrint(bg,mark){
  const ctx=pCv.getContext('2d'), u=SW/10, cx=SW/2, cy=PH/2;
  ctx.fillStyle=bg; ctx.fillRect(0,0,SW,PH);
  ctx.fillStyle=mark;
  ctx.fillRect(cx-2.5*u,cy-6*u,5*u,u);                           // T 가로 막대: 5 × 1칸
  ctx.fillRect(cx-u/2,cy-6*u,u,PH-(cy-6*u));                     // T 기둥: 가운데 한 칸 폭, 맨 아래 끝까지
  ctx.fillRect(cx-1.5*u,cy+6*u,3*u,u);                          // 맨 아래에서 세 번째 칸의 가로선: 3칸
  ctx.strokeStyle=mark; ctx.lineWidth=u*.07; ctx.beginPath();
  for(let k=-5;k<5;k++){ ctx.moveTo(cx+(k+.5)*u,0); ctx.lineTo(cx+(k+.5)*u,PH); }   // 가운데에 한 칸이 오도록 반 칸 옮긴 격자
  for(let k=-9;k<=9;k++){ ctx.moveTo(0,cy+k*u); ctx.lineTo(SW,cy+k*u); }
  ctx.stroke(); upload();
}
// 올린 이미지: 레진 비율(25:45)에 맞춰 가운데를 꽉 채워 넣는다
function drawImage(img){
  const ctx=pCv.getContext('2d'), iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height, s=Math.max(SW/iw,PH/ih);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,SW,PH); ctx.drawImage(img,(SW-iw*s)/2,(PH-ih*s)/2,iw*s,ih*s); upload();
}
(function(){
  gl.bindTexture(gl.TEXTURE_2D,pTex); drawPrint(DEF.bg,DEF.mark); texParams(true);
  const af=gl.getExtension('EXT_texture_filter_anisotropic');
  if(af) gl.texParameterf(gl.TEXTURE_2D,af.TEXTURE_MAX_ANISOTROPY_EXT,Math.min(8,gl.getParameter(af.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
})();

const VS=`#version 300 es

  vec3 w=uFM*(vec3(c*aPos.x+s*aPos.z,aPos.y,-s*aPos.x+c*aPos.z)+uOff)+uFO; vW=w;

// 무광 플라스틱(로프 구슬)
const FS_LIT=`#version 300 es
precision highp float;
in vec3 vW; in vec3 vN; out vec4 o;
uniform vec3 uCam; uniform vec3 uCol; uniform float uGloss;
${ENV}
void main(){
  vec3 n=normalize(vN), v=normalize(uCam-vW);
  if(dot(n,v)<0.) n=-n;
  float dif=max(dot(n,uL),0.), f=pow(1.-max(dot(n,v),0.),5.);
  vec3 c=uCol*(.56+.16*n.y+.34*dif);

// 크롬 도금
const FS_METAL=`#version 300 es
precision highp float;
in vec3 vW; in vec3 vN; out vec4 o;
uniform vec3 uCam; uniform vec3 uL;
vec3 envM(vec3 d){
  vec3 dk=vec3(.20,.21,.24);
  vec3 c=d.y>0.? mix(dk,vec3(.99,.99,.985),smoothstep(.03,.42,d.y)) : mix(dk,vec3(.90,.895,.88),smoothstep(-.03,-.55,d.y));
  c*=1.-.38*smoothstep(.55,.9,abs(d.x))*smoothstep(.0,.5,d.y);              // 양옆의 어두운 가림막: 금속에 띠 모양 명암이 생긴다
  c*=1.-.42*smoothstep(.90,.985,d.y);                                         // 바로 위(카메라 쪽)는 어둡게 비친다
  return c+vec3(1.,.98,.94)*pow(max(dot(d,uL),0.),40.)*.9;
}
void main(){
  vec3 n=normalize(vN), v=normalize(uCam-vW);
  if(dot(n,v)<0.) n=-n;
  float f=pow(1.-max(dot(n,v),0.),5.);
  vec3 c=envM(reflect(-v,n))*mix(vec3(.90,.91,.93),vec3(1.),f);
  c+=pow(max(dot(n,normalize(uL+v)),0.),260.)*1.2;
  o=vec4(c,1.);

// 투명 레진: 윗면에서 굴절된 광선을 안에서 추적해 바닥 인쇄면을 그린다
const FS_RESIN=`#version 300 es
precision highp float;
in vec3 vP; in vec3 vNl; out vec4 o;
uniform sampler2D uH; uniform sampler2D uPrint;
uniform vec3 uCamL; uniform int uPart; uniform vec2 uHS;
const float IOR=1.49;
${ENV}
vec2 uvOf(vec2 p){ return p/(2.*uHS)+.5; }
float Ht(vec2 p){ return texture(uH,uvOf(p)).x; }
vec3 topN(vec2 p){ vec3 t=texture(uH,uvOf(p)).xyz; return normalize(vec3(-t.y,1.,-t.z)); }
void main(){
  vec3 P=vP, I=normalize(P-uCamL);
  vec3 N=uPart==0? topN(P.xz) : normalize(vNl);
  float c0=dot(-I,N);
  if(c0<.02){ N=normalize(N+I*(c0-.02)); c0=max(dot(-I,N),.02); }
  float F=.04+.96*pow(1.-c0,5.);
  vec3 refl=env(reflect(I,N));
  float nh=max(dot(N,normalize(uL-I)),0.);
  float sp=pow(nh,700.)*5.+pow(nh,60.)*.18;
  vec3 d=refract(I,N,1./IOR), p=P-N*.03;
  vec3 col=vec3(0.), thr=vec3(1.);
  const vec3 ABS=vec3(.0080,.0026,.0011);
  for(int b=0;b<4;b++){
    float tB=d.y<-1e-4? -p.y/d.y : 1e9;
    float tx=abs(d.x)>1e-5? ((d.x>0.?uHS.x:-uHS.x)-p.x)/d.x : 1e9;
    float tz=abs(d.z)>1e-5? ((d.z>0.?uHS.y:-uHS.y)-p.z)/d.z : 1e9;
    float tW=min(tx,tz), tM=min(tB,tW), tH=-1.;
    if(d.y>-.45){
      float prev=0.;
      for(int i=1;i<=30;i++){
        float t=tM*float(i)/30.; vec3 q=p+d*t;
        if(q.y>Ht(q.xz)){
          float lo=prev, hi=t;
          for(int k=0;k<5;k++){ float m=.5*(lo+hi); vec3 qq=p+d*m; if(qq.y>Ht(qq.xz)) hi=m; else lo=m; }
          tH=hi; break;
        }
        prev=t;
      }
    }
    vec3 q, nIn;
    if(tH>0.){ q=p+d*tH; nIn=-topN(q.xz); thr*=exp(-ABS*tH); }
    else if(tB<=tW){ q=p+d*tB; thr*=exp(-ABS*tB); col+=thr*texture(uPrint,uvOf(q.xz)).rgb*1.06; thr=vec3(0.); break; }
    else { q=p+d*tW; nIn= tx<tz? vec3(-sign(d.x),0.,0.) : vec3(0.,0.,-sign(d.z)); thr*=exp(-ABS*tW); }
    vec3 od=refract(d,nIn,IOR); float Fr=1.;
    if(dot(od,od)>.5){ float ct=max(dot(od,-nIn),0.); Fr=.04+.96*pow(1.-ct,5.); col+=thr*(1.-Fr)*mix(env(od),vec3(.97,.97,.965),.55); }
    thr*=Fr; d=reflect(d,nIn); p=q+nIn*.03;
    if(max(thr.r,max(thr.g,thr.b))<.03) break;
  }
  col+=thr*vec3(.45,.74,.90);
  o=vec4(mix(col,refl,F)+sp,1.);
}`;
// 바닥 그림자: 둥근 사각형(레진) + 선분들(로프·사다리·자석)
const FS_SHADOW=`#version 300 es
precision highp float;
in vec3 vP; out vec4 o;
uniform vec4 uSegA[16]; uniform vec3 uSegB[16];
uniform vec4 uRect; uniform vec4 uRectP;     // 중심 xz, 반크기 / 회전, 모서리 반지름, 번짐, 세기
float rr(vec2 p,vec2 h,float r){ vec2 q=abs(p)-h+r; return length(max(q,0.))+min(max(q.x,q.y),0.)-r; }
void main(){
  vec2 p=vP.xz; float lit=1.;
  for(int i=0;i<16;i++){
    vec2 a=uSegA[i].xy, ab=uSegA[i].zw-a; float t=clamp(dot(p-a,ab)/max(dot(ab,ab),1e-5),0.,1.);
    float d=length(p-a-ab*t)-uSegB[i].x;
    lit*=1.-uSegB[i].z*(1.-smoothstep(-uSegB[i].y,uSegB[i].y,d));
  }

  lit*=1.-uRectP.w*(1.-smoothstep(-uRectP.z,uRectP.z,rr(q,uRect.zw,uRectP.y)));
  o=vec4(.20,.21,.27,1.-lit);
}`;
// 헤어라인 스테인리스: 가로 결(판의 x 방향)을 따라 길게 늘어진 반사
const FS_BRUSH=`#version 300 es
precision highp float;
in vec3 vW; in vec3 vN; in vec3 vP; out vec4 o;
uniform vec3 uCam; uniform vec3 uL; uniform mat3 uFM;
float h1(float x){ return fract(sin(x*127.1)*43758.5453); }
float rows(vec2 p,float f,float seed){                                       // 결 한 겹: 줄마다 밝기가 다르고 길이가 끝나는 가는 선
  float y=p.y*f, i=floor(y), fr=fract(y);
  float a=h1(i+seed+floor(p.x*.007+h1(i)*9.)*13.), b=h1(i+1.+seed+floor(p.x*.007+h1(i+1.)*9.)*13.);
  return mix(a,b,fr*fr*(3.-2.*fr));

void main(){
  vec3 n=normalize(vN), v=normalize(uCam-vW);
  if(dot(n,v)<0.) n=-n;
  vec3 T=normalize(uFM*vec3(1.,0.,0.)), H=normalize(uL+v), R=reflect(-v,n);
  float fw=fwidth(vP.z);
  float s=0., wsum=0.;
  for(int k=0;k<3;k++){ float f=k==0?2.4:(k==1?5.5:11.), w=(k==0?.34:(k==1?.33:.33))*(1.-smoothstep(.3,.8,fw*f));
    s+=rows(vP.xz,f,float(k)*31.)*w; wsum+=w; }
  s=wsum>0.? (s/wsum-.5)*wsum : 0.;                                          // 멀어지면 결이 고르게 뭉개진다
  vec3 base=mix(vec3(.36,.37,.39),vec3(.80,.80,.79),smoothstep(-.7,.9,R.y));
  float aniso=pow(sqrt(max(1.-pow(dot(T,H),2.),0.)),48.);                    // 결에 수직으로 퍼지는 넓은 빛띠
  vec3 c=base*(.94+.13*s)+vec3(.26)*aniso*(.8+.5*s);
  c+=pow(1.-max(dot(n,v),0.),5.)*.25;
  o=vec4(c,1.);
}`;
// 메모지: 디자인 이미지(캔버스로 그린 텍스처)를 붙인 종이
const FS_PAPER=`#version 300 es
precision highp float;
in vec3 vP; in vec3 vN; out vec4 o;
uniform vec3 uL; uniform sampler2D uTex; uniform float uHalf;
void main(){
  vec3 c=texture(uTex,vP.xz/(2.*uHalf)+.5).rgb;
  o=vec4(c*(.92+.08*max(dot(normalize(vN),uL),0.)),1.);

function prog(vs,fs){
  const p=gl.createProgram();
  for(const [t,s] of [[gl.VERTEX_SHADER,vs],[gl.FRAGMENT_SHADER,fs]]){
    const sh=gl.createShader(t); gl.shaderSource(sh,s); gl.compileShader(sh);
    if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    gl.attachShader(p,sh);
  }
  gl.bindAttribLocation(p,0,'aPos'); gl.bindAttribLocation(p,1,'aNor');
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u={}, n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){ const nm=gl.getActiveUniform(p,i).name.replace('[0]',''); u[nm]=gl.getUniformLocation(p,nm); }
  return {p,u};
}
const P_LIT=prog(VS,FS_LIT), P_METAL=prog(VS,FS_METAL), P_RESIN=prog(VS,FS_RESIN), P_SHADOW=prog(VS,FS_SHADOW), P_BRUSH=prog(VS,FS_BRUSH), P_PAPER=prog(VS,FS_PAPER);

/* ---------- 지오메트리 ---------- */
function mesh(g){
  const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  for(const [i,a] of [[0,g.pos],[1,g.nor]]){ const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(a),gl.STATIC_DRAW);
    gl.enableVertexAttribArray(i); gl.vertexAttribPointer(i,3,gl.FLOAT,false,0,0); }
  const e=gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,e); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(g.idx),gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  return {vao,n:g.idx.length};
}
const G=()=>({pos:[],nor:[],idx:[]});
// 부품을 변환해서 합치기: f(x,y,z) → [x,y,z] (회전/뒤집기), t = 이동
function add(dst,src,f,t){
  const b=dst.pos.length/3; f=f||((x,y,z)=>[x,y,z]); t=t||[0,0,0];
  for(let i=0;i<src.pos.length;i+=3){ const p=f(src.pos[i],src.pos[i+1],src.pos[i+2]), n=f(src.nor[i],src.nor[i+1],src.nor[i+2]);
    dst.pos.push(p[0]+t[0],p[1]+t[1],p[2]+t[2]); dst.nor.push(n[0],n[1],n[2]); }
  for(const k of src.idx) dst.idx.push(b+k);
  return dst;
}
const Y2X=(x,y,z)=>[y,x,z];            // y축 회전체를 x축 방향으로 눕히기
// 회전체: 단면 [r,y]
function lathe(prof,seg){
  seg=seg||40; const g=G();
  for(let s=0;s<prof.length-1;s++){
    const [r0,y0]=prof[s],[r1,y1]=prof[s+1]; let nr=y1-y0, ny=-(r1-r0); const l=Math.hypot(nr,ny)||1; nr/=l; ny/=l;
    const base=g.pos.length/3;
    for(let i=0;i<=seg;i++){ const a=i/seg*Math.PI*2, c=Math.cos(a), sn=Math.sin(a);
      g.pos.push(r0*c,y0,r0*sn, r1*c,y1,r1*sn); g.nor.push(nr*c,ny,nr*sn, nr*c,ny,nr*sn); }
    for(let i=0;i<seg;i++){ const k=base+2*i; g.idx.push(k,k+1,k+2, k+1,k+3,k+2); }
  }
  return g;
}
// 둥근 단면 회전체(매끈한 법선): 구슬처럼 모서리가 둥근 것
function latheSmooth(prof,seg){
  seg=seg||28; const g=G(), n=prof.length, nrm=[];
  for(let s=0;s<n;s++){ const a=prof[Math.max(s-1,0)], b=prof[Math.min(s+1,n-1)]; let nr=b[1]-a[1], ny=-(b[0]-a[0]); const l=Math.hypot(nr,ny)||1; nrm.push([nr/l,ny/l]); }
  for(let s=0;s<n;s++) for(let i=0;i<=seg;i++){ const a=i/seg*Math.PI*2, c=Math.cos(a), sn=Math.sin(a);
    g.pos.push(prof[s][0]*c,prof[s][1],prof[s][0]*sn); g.nor.push(nrm[s][0]*c,nrm[s][1],nrm[s][0]*sn); }
  for(let s=0;s<n-1;s++) for(let i=0;i<seg;i++){ const k=s*(seg+1)+i, m=k+seg+1; g.idx.push(k,m,k+1, k+1,m,m+1); }
  return g;
}
// 자석 받침: 옆면에 톱니(널링)가 있는 납작한 원판
function knurl(r,h,teeth){
  const g=G(), N=teeth*2;
  for(let i=0;i<N;i++){
    const a0=i/N*Math.PI*2, a1=(i+1)/N*Math.PI*2, r0=r+(i%2?-.16:.0), r1=r+(i%2?.0:-.16);
    const p0=[r0*Math.cos(a0),r0*Math.sin(a0)], p1=[r1*Math.cos(a1),r1*Math.sin(a1)];
    let nx=p1[1]-p0[1], nz=-(p1[0]-p0[0]); const l=Math.hypot(nx,nz); nx/=l; nz/=l;
    const b=g.pos.length/3;
    g.pos.push(p0[0],0,p0[1], p0[0],h,p0[1], p1[0],0,p1[1], p1[0],h,p1[1]); g.nor.push(nx,0,nz,nx,0,nz,nx,0,nz,nx,0,nz);
    g.idx.push(b,b+1,b+2, b+1,b+3,b+2);
  }
  add(g,lathe([[r-.1,h],[r-.55,h+.32],[r-1.15,h+.32],[r-1.45,h+.1],[r-1.9,h+.1],[r-2.2,h+.32],[0,h+.32]],48));   // 윗면의 동심원 홈
  return g;
}
// 고리(토러스), y축 둘레로 눕힌 상태
function torus(R,r,seg,ring){
  seg=seg||36; ring=ring||14; const g=G();
  for(let i=0;i<=seg;i++){ const a=i/seg*Math.PI*2, ca=Math.cos(a), sa=Math.sin(a);
    for(let j=0;j<=ring;j++){ const b=j/ring*Math.PI*2, cb=Math.cos(b), sb=Math.sin(b);
      g.pos.push((R+r*cb)*ca, r*sb, (R+r*cb)*sa); g.nor.push(cb*ca,sb,cb*sa); } }
  for(let i=0;i<seg;i++)for(let j=0;j<ring;j++){ const k=i*(ring+1)+j, m=k+ring+1; g.idx.push(k,m,k+1, k+1,m,m+1); }
  return g;
}
// 관: yz 평면 위의 경로 [z,y] 를 따라가는 둥근 파이프 (x = x0)
function tubeYZ(path,x0,r,ring){
  ring=ring||18; const g=G(), n=path.length;
  for(let s=0;s<n;s++){
    const a=path[Math.max(s-1,0)], b=path[Math.min(s+1,n-1)]; let tz=b[0]-a[0], ty=b[1]-a[1]; const l=Math.hypot(tz,ty)||1; tz/=l; ty/=l;
    const nz=-ty, ny=tz;                                   // 경로에 수직(평면 안)
    for(let j=0;j<=ring;j++){ const ang=j/ring*Math.PI*2, c=Math.cos(ang), sn=Math.sin(ang);
      const dx=c, dy=sn*ny, dz=sn*nz;
      g.pos.push(x0+r*dx, path[s][1]+r*dy, path[s][0]+r*dz); g.nor.push(dx,dy,dz); }
  }
  for(let s=0;s<n-1;s++)for(let j=0;j<ring;j++){ const k=s*(ring+1)+j, m=k+ring+1; g.idx.push(k,m,k+1, k+1,m,m+1); }
  return g;
}

/* 레인 로프: 구슬 26알 + 양 끝 고리와 자석 */
const BEAD=1.85, COLORS=[[.90,.16,.13],[.975,.975,.97],[.36,.74,.93]];     // 빨강, 흰색, 하늘색

    -(x[0]*e[0]+x[1]*e[1]+x[2]*e[2]), -(y[0]*e[0]+y[1]*e[1]+y[2]*e[2]), -(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]), 1];
}
function mul(a,b){ const o=new Float32Array(16); for(let c=0;c<4;c++)for(let r=0;r<4;r++){ let s=0; for(let k=0;k<4;k++) s+=a[k*4+r]*b[c*4+k]; o[c*4+r]=s; } return o; }

/* ---------- 그리기 ---------- */
let VP, CAM;
function use(P,F){ F=F||FR_ID; gl.useProgram(P.p); gl.uniformMatrix4fv(P.u.uVP,false,VP); gl.uniformMatrix3fv(P.u.uFM,false,F.M); gl.uniform3fv(P.u.uFO,F.O);
  if(P.u.uL) gl.uniform3fv(P.u.uL,L); if(P.u.uCam) gl.uniform3fv(P.u.uCam,CAM); }
function put(P,m,pl){ gl.uniform3fv(P.u.uOff,pl?pl.off:[0,0,0]); gl.uniform1f(P.u.uRot,pl?pl.rot:0); gl.bindVertexArray(m.vao); gl.drawElements(gl.TRIANGLES,m.n,gl.UNSIGNED_INT,0); }
function shadows(F,list,quad,y,rect){
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
  use(P_SHADOW,F);
  gl.uniform4fv(P_SHADOW.u.uSegA,list.A); gl.uniform3fv(P_SHADOW.u.uSegB,list.B);
  gl.uniform4fv(P_SHADOW.u.uRect,rect?rect.slice(0,4):[0,0,0,0]); gl.uniform4fv(P_SHADOW.u.uRectP,rect?rect.slice(4):[0,0,1,0]);
  put(P_SHADOW,quad,{off:[0,y,0],rot:0});
  gl.disable(gl.BLEND); gl.depthMask(true);
}
function draw(){
  const ce=Math.cos(S.el), se=Math.sin(S.el);
  CAM=[S.tx+S.dist*ce*Math.sin(S.az), S.ty+S.dist*se, S.tz+S.dist*ce*Math.cos(S.az)];
  const pm=persp(FOV,W/Hpx,S.dist*.08,S.dist*4+600); pm[8]=SX(); pm[9]=SY();
  VP=mul(pm, look(CAM,[S.tx,S.ty,S.tz]));
  gl.viewport(0,0,cv.width,cv.height);
  gl.clearColor(BG[0],BG[1],BG[2],1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);

  const F=stand?FR_F:FR_ID, r=PL.resin, h=6.5;
  const sv=stand?SHV.stand:SHV.floor, resinSh=[r.off[0]+sv[0]*h*.55,r.off[2]+sv[1]*h*.55,HX,HZ, r.rot,CR,2.6,.30];
  if(stand){
    shadows(FR_ID,SHG,ground,.01,[4,-3,PW,2*PL2*sT, 0,6,16,.10]);
    use(P_BRUSH,FR_F); put(P_BRUSH,slab,SLAB_PL); use(P_BRUSH,FR_B); put(P_BRUSH,slab,SLAB_PL); use(P_BRUSH,FR_ID); put(P_BRUSH,bend);
    use(P_PAPER,F); gl.uniform1f(P_PAPER.u.uHalf,MEMO); gl.uniform1i(P_PAPER.u.uTex,2); gl.activeTexture(gl.TEXTURE2);
    for(const k of PL.paperA.off[1]<PL.paperB.off[1]? ['paperA','paperB'] : ['paperB','paperA']){ gl.bindTexture(gl.TEXTURE_2D,k==='paperA'?texMemoA:texMemoB); put(P_PAPER,paper,PL[k]); }
    shadows(F,SHD.stand,boardQuad,.34,resinSh);                                   // 메모지 두 장보다 위에 깔아 메모지 위에도 똑같이 드리운다
  } else shadows(FR_ID,SHD.floor,ground,.01,resinSh);

  // 로프 구슬(무광)
  use(P_LIT,F); gl.uniform1f(P_LIT.u.uGloss,0.);
  ropeBeads.forEach((m,i)=>{ gl.uniform3fv(P_LIT.u.uCol,COLORS[i]); put(P_LIT,m,PL.rope); });
  // 크롬 부품
  use(P_METAL,F); put(P_METAL,ropeMetal,PL.rope); put(P_METAL,ladder,PL.ladder); if(stand){ put(P_METAL,pin,PL.pinA); put(P_METAL,pin,PL.pinB); }
  // 타일 레진: 카메라와 조명을 레진 기준 좌표로 옮겨 내부 광선을 추적
  const cs=Math.cos(r.rot), sn=Math.sin(r.rot), M=F.M;
  const inv=(v,o)=>{ const x=v[0]-o[0], y=v[1]-o[1], z=v[2]-o[2]; return [M[0]*x+M[1]*y+M[2]*z, M[3]*x+M[4]*y+M[5]*z, M[6]*x+M[7]*y+M[8]*z]; };
  const loc=q=>[cs*q[0]-sn*q[2],q[1],sn*q[0]+cs*q[2]];
  const cf=inv(CAM,F.O), lf=inv(L,[0,0,0]);
  use(P_RESIN,F);
  gl.uniform3fv(P_RESIN.u.uL,loc(lf)); gl.uniform3fv(P_RESIN.u.uCamL,loc([cf[0]-r.off[0],cf[1]-r.off[1],cf[2]-r.off[2]]));
  gl.uniform2f(P_RESIN.u.uHS,HX,HZ);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,hTex); gl.uniform1i(P_RESIN.u.uH,0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,pTex); gl.uniform1i(P_RESIN.u.uPrint,1);
  gl.uniform1i(P_RESIN.u.uPart,0); put(P_RESIN,resinTop,r);
  gl.uniform1i(P_RESIN.u.uPart,1); put(P_RESIN,resinSide,r);
  gl.bindVertexArray(null);
}

/* ---------- 루프 ---------- */
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2); W=cv.clientWidth||1; Hpx=cv.clientHeight||1;
  const w=Math.round(W*dpr), h=Math.round(Hpx*dpr);
  if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
  if(view) applyView(); else dirty=true;
}
let last=0;
function frame(t){
  const dt=Math.min((t-last)/1000,.05); last=t;
  const k=1-Math.exp(-dt*7);
  for(const key in S){ const d=Tg[key]-S[key]; if(Math.abs(d)>1e-4){ S[key]+=d*k; dirty=true; } else S[key]=Tg[key]; }
  if(dirty){ dirty=false; draw(); }
  requestAnimationFrame(frame);
}

/* ---------- 조작 ---------- */
const pts=new Map(); let pinch=0, drag=null;
/* 제품 옮기기: 화면 좌표 → 시선 광선 → 바닥(또는 스탠드 앞판) 평면 위 좌표 */
function surfPoint(e){
  const r=cv.getBoundingClientRect(), tn=Math.tan(FOV/2), A=W/Hpx;
  const nx=(e.clientX-r.left)/W*2-1+SX(), ny=1-(e.clientY-r.top)/Hpx*2+SY();
  const z=norm([CAM[0]-S.tx,CAM[1]-S.ty,CAM[2]-S.tz]); let x=norm([z[2],0,-z[0]]); if(!isFinite(x[0])||Math.hypot(x[0],x[2])<1e-6) x=[1,0,0];
  const y=[z[1]*x[2]-z[2]*x[1], z[2]*x[0]-z[0]*x[2], z[0]*x[1]-z[1]*x[0]];
  const d=[0,1,2].map(i=>-z[i]+x[i]*nx*tn*A+y[i]*ny*tn);
  const F=stand?FR_F:FR_ID, M=F.M, n=[M[3],M[4],M[5]];                             // 평면 법선 = 판의 local y
  const den=d[0]*n[0]+d[1]*n[1]+d[2]*n[2]; if(Math.abs(den)<1e-5) return null;
  const k=((F.O[0]-CAM[0])*n[0]+(F.O[1]-CAM[1])*n[1]+(F.O[2]-CAM[2])*n[2])/den; if(k<=0) return null;
  const q=[CAM[0]+d[0]*k-F.O[0], CAM[1]+d[1]*k-F.O[1], CAM[2]+d[2]*k-F.O[2]];
  return [M[0]*q[0]+M[1]*q[1]+M[2]*q[2], M[6]*q[0]+M[7]*q[1]+M[8]*q[2]];         // 판 위 (x, z)
}
const HALF=()=>({ pinA:[2.2,2.2], pinB:[2.2,2.2], rope:[ropeLen/2+MAG+3,3.2], ladder:[LAD.hw+LAD.foot,LAD.hl+LAD.foot], resin:[HX,HZ], paperA:[MEMO,MEMO], paperB:[MEMO,MEMO] });
const NAME={rope:'레인 로프',ladder:'사다리',resin:'타일 레진',paperA:'줄 메모지',paperB:'수영장 메모지',pinA:'자석',pinB:'자석'};
function pick(e){
  if(!VP) return null; const s=surfPoint(e); if(!s) return null; const H=HALF();
  const papers=PL.paperA? (PL.paperA.off[1]<PL.paperB.off[1]? ['paperB','paperA'] : ['paperA','paperB']) : [];
  for(const k of ['pinA','pinB','rope','ladder','resin',...papers]){ const q=PL[k]; if(!q) continue;
    const l=rotW(s[0]-q.off[0],s[1]-q.off[2],-q.rot);
    if(Math.abs(l[0])<=H[k][0]+1.5&&Math.abs(l[1])<=H[k][1]+1.5) return {k,s}; }
  return null;
}
function clampItem(k){ const q=PL[k];
  if(stand){ q.off[0]=Math.min(Math.max(q.off[0],-PW+4),PW-4); q.off[2]=Math.min(Math.max(q.off[2],-PL2+BTL+4),PL2-4); }
  else { const r=Math.hypot(q.off[0],q.off[2]); if(r>90){ q.off[0]*=90/r; q.off[2]*=90/r; } } }
function refreshShadows(){ SHD.floor=shadowList(LAY.floor,SHV.floor); SHD.stand=shadowList(LAY.stand,SHV.stand); dirty=true; }
function setView(v){ view=v; document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===v)); }
function wrapAz(){ const e=Math.round(S.az/(2*Math.PI))*2*Math.PI; S.az-=e; Tg.az-=e; }
cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId);
  if(!pts.size){ const h=pick(e); select(h?h.k:sel);
    if(h){ const q=PL[h.k];
      if(h.k==='paperA'||h.k==='paperB'){ const o=h.k==='paperA'?'paperB':'paperA'; q.off[1]=.22; PL[o].off[1]=.12; }   // 잡은 메모지를 위로
      const rotMode=e.button===2||e.shiftKey;
      drag={k:h.k, mode:rotMode?'rot':'move', dx:q.off[0]-h.s[0], dz:q.off[2]-h.s[1], a0:Math.atan2(h.s[1]-q.off[2],h.s[0]-q.off[0]), r0:q.rot}; } }
  else if(drag&&pts.size===1){ const a=[...pts.values()][0]; drag.mode='twist'; drag.r0=PL[drag.k].rot; drag.t0=Math.atan2(e.clientY-a[1],e.clientX-a[0]); }   // 두 손가락: 비틀어 회전
  pts.set(e.pointerId,[e.clientX,e.clientY]); cv.classList.add('drag'); });
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointermove',e=>{
  const p=pts.get(e.pointerId);
  if(!p){ if(e.pointerType==='mouse') cv.classList.toggle('over',!!pick(e)); return; }
  if(drag&&drag.mode==='twist'){ p[0]=e.clientX; p[1]=e.clientY; if(pts.size===2){ const [a,b]=[...pts.values()];
      PL[drag.k].rot=drag.r0-(Math.atan2(b[1]-a[1],b[0]-a[0])-drag.t0); refreshShadows(); } return; }
  if(drag&&pts.size===1){ const s=surfPoint(e); if(s){ const q=PL[drag.k];
      if(drag.mode==='rot') q.rot=drag.r0-(Math.atan2(s[1]-q.off[2],s[0]-q.off[0])-drag.a0);
      else { q.off[0]=s[0]+drag.dx; q.off[2]=s[1]+drag.dz; clampItem(drag.k); }
      refreshShadows(); } p[0]=e.clientX; p[1]=e.clientY; return; }
  if(pts.size===1){ setView(''); Tg.az-=(e.clientX-p[0])*.008; Tg.el=Math.min(1.56,Math.max(.05,Tg.el+(e.clientY-p[1])*.008)); }
  p[0]=e.clientX; p[1]=e.clientY;
  if(pts.size===2){ const [a,b]=[...pts.values()], d=Math.hypot(a[0]-b[0],a[1]-b[1]); if(pinch) zoom(pinch/d); pinch=d; }
  dirty=true;
});
function up(e){ pts.delete(e.pointerId); pinch=0; if(!pts.size){ cv.classList.remove('drag'); drag=null; } }
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
function zoom(f){ const base=stand?fit(84,127):fit(52,58); Tg.dist=Math.min(base*2,Math.max(base*.12,Tg.dist*f)); dirty=true; }
cv.addEventListener('dblclick',e=>{ const h=pick(e); if(!h) return; select(h.k); turn(-1); });   // 더블클릭: 15° 회전
let sel=null; const selName=document.getElementById('selName'), bRotL=document.getElementById('bRotL'), bRotR=document.getElementById('bRotR');
function select(k){ sel=k&&PL[k]?k:null; selName.textContent=sel?NAME[sel]:'제품을 선택하세요'; bRotL.disabled=bRotR.disabled=!sel; }
function turn(s){ if(!sel) return; PL[sel].rot+=s*Math.PI/12; refreshShadows(); }
bRotL.addEventListener('click',()=>turn(1)); bRotR.addEventListener('click',()=>turn(-1));
document.getElementById('bLayout').addEventListener('click',()=>{ const src=LAY0[stand?'stand':'floor'], dst=LAY[stand?'stand':'floor'];
  for(const k in src){ dst[k].off=src[k].off.slice(); dst[k].rot=src[k].rot; } refreshShadows(); });
cv.addEventListener('keydown',e=>{ if(sel&&(e.key==='q'||e.key==='Q')) turn(1); else if(sel&&(e.key==='e'||e.key==='E')) turn(-1); });
cv.addEventListener('wheel',e=>{ e.preventDefault(); zoom(Math.exp(e.deltaY*.0012)); },{passive:false});
cv.addEventListener('keydown',e=>{
  const m={ArrowLeft:[.12,0],ArrowRight:[-.12,0],ArrowUp:[0,.08],ArrowDown:[0,-.08]}[e.key];
  if(m){ e.preventDefault(); setView(''); Tg.az+=m[0]; Tg.el=Math.min(1.56,Math.max(.05,Tg.el+m[1])); }
  else if(e.key==='+'||e.key==='=') zoom(.88); else if(e.key==='-') zoom(1.14);
});
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{ wrapAz(); setView(b.dataset.view); applyView(); }));
const cB=document.getElementById('cBg'), cM=document.getElementById('cMark'), note=document.getElementById('artNote');
const NOTE0=note.textContent;
function recolor(save){ drawPrint(cB.value,cM.value); note.textContent=NOTE0; dirty=true;
  if(save) try{ localStorage.setItem('poolmagnet-colors-2',JSON.stringify([cB.value,cM.value])); }catch(e){} }
for(const c of [cB,cM]) c.addEventListener('input',()=>recolor(true));
document.getElementById('bReset').addEventListener('click',()=>{ cB.value=DEF.bg; cM.value=DEF.mark; recolor(true); });
document.getElementById('fImg').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const img=new Image(), url=URL.createObjectURL(f);
  img.onload=()=>{ drawImage(img); URL.revokeObjectURL(url); note.textContent='올린 이미지를 쓰는 중입니다. 색을 바꾸거나 "원래대로"를 누르면 기본 무늬로 돌아갑니다.'; dirty=true; };
  img.onerror=()=>{ URL.revokeObjectURL(url); note.textContent='이 파일은 이미지로 열 수 없습니다.'; };
  img.src=url; e.target.value='';
});
try{ const s=JSON.parse(localStorage.getItem('poolmagnet-colors-2')); if(Array.isArray(s)&&s.length===2&&s.every(v=>/^#[0-9a-f]{6}$/i.test(v))){ cB.value=s[0]; cM.value=s[1]; recolor(false); } }catch(e){}
const bStand=document.getElementById('bStand'), LBL={top:['위에서','정면'],angle:['사선','사선'],low:['낮게','옆에서']};
bStand.addEventListener('click',()=>{ stand=!stand; PL=stand?LAY.stand:LAY.floor; bStand.setAttribute('aria-pressed',stand);
  for(const k in LBL) document.querySelector('[data-view='+k+']').textContent=LBL[k][stand?1:0];
  document.querySelector('.spec').textContent=stand?'레인 로프 · 사다리 · 타일 레진 · A형 스탠드 W120 × H170 × D85 mm, 1.2T 양면 헤어라인':'레인 로프 · 사다리 · 타일 레진';
  select(null); wrapAz(); setView('top'); applyView(); });
window.addEventListener('resize',resize);
resize(); Object.assign(S,Tg);
if(window.SITE){   // inside the site: on the A stand, seen at an angle
  bStand.click(); setView('angle'); applyView(); Object.assign(S,Tg);
  const A0=Tg.az;
  window.__site={ ready:true, setLight(az,el){ const a=A0+az*Math.PI/180, e=el*Math.PI/180; L[0]=Math.sin(a)*Math.cos(e); L[1]=Math.sin(e); L[2]=Math.cos(a)*Math.cos(e); dirty=true; },  setBG(c){ BG[0]=c[0]; BG[1]=c[1]; BG[2]=c[2]; dirty=true; }, reset(){ wrapAz(); setView('angle'); applyView(); } };
}
requestAnimationFrame(frame);

}catch(e){ msg.style.display='flex'; msg.textContent='3D 모델을 그리지 못했습니다: '+e.message; }
})();
</script>
