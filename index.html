  <section id="light-panel" class="light-panel" popover aria-label="조명 위치">

      <span class="light-steps"><button type="button" id="lampReset" class="lamp-reset">처음 자리</button><button type="button" popovertarget="light-panel" popovertargetaction="hide" aria-label="조명 위치 닫기">×</button></span></header>
    <div class="lamp-body">

        <span class="lamp-side back">뒤</span><span class="lamp-side front">카메라 쪽</span>
        <span id="lamp-dot" class="lamp-dot" aria-hidden="true"></span>
      </div>
      <div class="lamp-info">
        <strong id="lamp-where"></strong>
        <label class="lamp-height">높이<input id="lamp-height" type="range" min="12" max="89" step="1"></label>
        <p>점을 끌어 조명을 옮겨 보세요. 가운데로 갈수록 위에서, 가장자리로 갈수록 낮게 비춰서 그림자가 길어져요.</p>
      </div>
    </div>
  </section>
  <footer class="footer">
    <nav class="zone-nav" aria-label="섬 고르기">
      <span class="rope" aria-hidden="true"></span>
      <div class="lanes"><button type="button" id="prevIsland" class="lane-step previous" aria-label="Climbing 섬으로 이동"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
    
      <button type="button" class="lane-btn" data-island="tennis" aria-pressed="true"><span>Tennis</span></button>
      <button type="button" class="lane-btn" data-island="pool" aria-pressed="false"><span>Swim</span></button>
      <button type="button" class="lane-btn" data-island="climb" aria-pressed="false"><span>Climbing</span></button>
      <button type="button" id="nextIsland" class="lane-step next" aria-label="Swim 섬으로 이동"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button></div>
      <div class="products pool-sub" role="group" aria-label="Swim 섬 제품" hidden>
      <button type="button" class="pool-sub" data-sub="aquable" aria-pressed="false" hidden title="레인 프린트 수영장"><span class="nav-dot pool"></span><span>Aquable</span></button>
      <button type="button" class="pool-sub" data-sub="prussian" aria-pressed="false" hidden title="검정 격자의 프러시안 블루 타일 수영장"><span class="nav-dot print"></span><span>Prussian Blue</span></button>
      <button type="button" class="pool-sub" data-sub="drops" aria-pressed="false" hidden title="물방울이 떨어지는 노트북 위"><span class="nav-dot drops"></span><span>Water Drop</span></button>
      <button type="button" class="pool-sub" data-sub="grip" aria-pressed="false" hidden title="휴대폰 맥세이프에 붙인 수영장 그립톡"><span class="nav-dot grip"></span><span>Grip Tok</span></button>
      <button type="button" class="pool-sub" data-sub="magnet" aria-pressed="false" hidden title="스테인리스 스탠드에 붙인 수영장 자석"><span class="nav-dot magnet"></span><span>Magnet</span></button>
      <button type="button" class="pool-sub" id="toys-tab" aria-pressed="false" hidden title="튜브, 오리발, 킥판을 꺼내요. 수영곰에게 끌어다 주면 써요." aria-controls="toy-tray"><span class="nav-dot toys"></span><span>물놀이</span></button>
      </div>
      <div id="grip-controls" class="grip-controls" role="group" aria-label="그립톡 접기와 펴기" hidden>
        <button type="button" data-grip="1">한 단 접기</button>
        <button type="button" data-grip="2">끝까지 접기</button>
        <button type="button" data-grip="0" class="grip-open">펴기!</button>
        <button type="button" data-grip="phone" aria-pressed="false">폰에 부착</button>
      </div>
      <div id="toy-tray" class="toy-tray" hidden role="group" aria-label="물놀이 용품">
        <button type="button" class="toy" data-toy="tube" aria-pressed="false" title="튜브: 끌어서 곰에게 주세요"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="15" fill="none" stroke="#f7f5ee" stroke-width="11"/><circle cx="24" cy="24" r="15" fill="none" stroke="#5fa8b8" stroke-width="11" stroke-dasharray="11.78 11.78"/><circle cx="24" cy="24" r="20.5" fill="none" stroke="#3d5036" stroke-opacity=".25"/><circle cx="24" cy="24" r="9.5" fill="none" stroke="#3d5036" stroke-opacity=".25"/></svg><span>튜브</span></button>
        <button type="button" class="toy" data-toy="fins" aria-pressed="false" title="오리발: 끌어서 곰에게 주세요"><svg viewBox="0 0 48 48" aria-hidden="true"><g fill="#f0a04b" stroke="#c9792f" stroke-width="1.2" stroke-linejoin="round"><path d="M13 6h7c1 9 5 20 5 30-5 4-12 4-17 0 0-10 4-21 5-30z" transform="rotate(-8 16 24)"/><path d="M28 6h7c1 9 5 20 5 30-5 4-12 4-17 0 0-10 4-21 5-30z" transform="rotate(8 32 24)"/></g></svg><span>오리발</span></button>
        <button type="button" class="toy" data-toy="board" aria-pressed="false" title="킥판: 끌어서 곰에게 주세요"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M11 42V20C11 2 37 2 37 20v22c-8-3-18-3-26 0z" fill="#f2d24b" stroke="#c9a92c" stroke-width="1.3" stroke-linejoin="round"/><rect x="14" y="28" width="20" height="5" rx="2" fill="#5fa8b8"/></svg><span>킥판</span></button>
        <p class="toy-hint">끌어서 수영곰에게 주세요</p>
      </div>
    </nav>
