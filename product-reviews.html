<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>구매 후기 · ALLTÄGLICH</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fafafa;color:#171717;font:15px/1.6 system-ui,sans-serif}
    main{max-width:740px;margin:auto;padding:26px 16px 48px}
    header{border-bottom:1px solid #ddd;padding-bottom:14px}
    .brand{font-size:12px;letter-spacing:.16em;font-weight:800}
    h1{margin:8px 0 4px;font-size:clamp(22px,5vw,32px);line-height:1.3}
    .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}
    select,button{font:inherit;color:inherit;background:white;border:1px solid #d0d0d0;border-radius:8px;padding:5px 10px}
    button{cursor:pointer}button[aria-pressed=true]{background:#171717;color:white;border-color:#171717}
    article{border-top:1px solid #ddd;padding:14px 0}
    .meta{color:#555;font-size:12px;display:flex;gap:8px;flex-wrap:wrap}
    article p{margin:7px 0;white-space:pre-wrap;overflow-wrap:anywhere}
    .photos{display:flex;gap:8px;flex-wrap:wrap}.photos img{display:block;width:84px;height:84px;object-fit:contain;background:#eee;border-radius:6px}
    details{font-size:13px;color:#555}summary{cursor:pointer}
    #more{margin-top:12px}#status{margin:4px 0;color:#555}
  </style>
  <script defer src="./js/product-reviews.js"></script>
</head>
<body>
  <main>
    <header>
      <span class="brand">ALLTÄGLICH</span>
      <h1 id="title">구매 후기</h1>
      <p id="status" role="status">후기를 불러오는 중…</p>
    </header>
    <div class="controls" id="controls" hidden>
      <label>후기 언어
        <select id="language">
          <option value="original">원문</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="it">Italiano</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="zh">简体中文</option>
          <option value="zh-Hant">繁體中文（台灣）</option>
          <option value="th">ไทย</option>
        </select>
      </label>
      <div id="sources" class="controls" aria-label="후기 출처"></div>
    </div>
    <section id="reviews" aria-labelledby="title"></section>
    <button id="more" type="button" hidden>후기 더 보기</button>
  </main>
</body>
</html>
